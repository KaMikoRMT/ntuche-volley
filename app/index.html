<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台大化工男排整合系統</title>
<meta name="theme-color" content="#8c2333">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
    /* 配色與元件沿用 v5：暖色 tokens＋深色模式；紀錄表是「紙」，兩種主題都維持白底黑字 */
    :root {
        --bg: #f3ece3;
        --surface: #fbf8f4;
        --ink: #3a2e29;
        --muted: #85766c;
        --line: #e2d6cb;
        --band: #8c2333;
        --on-band: #fff8f2;
        --band-soft: rgba(255, 248, 242, 0.16);
        --band-line: rgba(255, 248, 242, 0.45);
        --score: #5e7746;
        --score-team: #3f5530;
        --score-text: #4f6a3a;
        --loss: #b04a4f;
        --loss-team: #6d1a27;
        --loss-text: #a03a40;
        --cont: #8a6d2b;
        /* 配球位置的分類色（資料視覺化的類別色，依序驗證過色盲辨識；一定搭配文字標籤） */
        --pos-oh: #2a78d6;
        --pos-mb: #eb6834;
        --pos-opp: #1baf7a;
        --pos-s: #eda100;
        --pos-none: #a89a90;
        --on-btn: #ffffff;
        --chip: #f6e9e4;
        --chip-line: #dbb7ae;
        --chip-on: #8c2333;
        --on-chip-on: #ffffff;
        --gold: #e8c26a;
        --on-gold: #3a2e29;
        --warn: #d9a62e;
        --on-warn: #3a2e29;
        --pending-bg: #fff176;
        --pending-fg: #8a6500;
        --tally: #4a3a33;
        --scrim: rgba(28, 18, 14, 0.5);
        --shadow: 0 1px 4px rgba(40, 24, 18, 0.18);
        --paper: #ffffff;
        --paper-ink: #111111;
        --paper-line: #9a9a9a;
        --paper-rule: #000000;
        --paper-rule2: #555555;
        --paper-head: #f4f4f4;
        --paper-label: #eeeeee;
        --paper-soft: #fafafa;
        --paper-dash: #bbbbbb;
        --paper-sub: #555555;
        --paper-pending: #fff176;
        --paper-pending-fg: #8a6500;
        --font-ui: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        --font-score: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", -apple-system, sans-serif;
        color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #1d1816; --surface: #28211e; --ink: #f1e7df; --muted: #a8978b; --line: #3d332e;
            --band: #5e1824; --on-band: #fff3ec;
            --score: #5c7646; --score-team: #445c33; --score-text: #9bbb7c;
            --loss: #a9474e; --loss-team: #74222f; --loss-text: #ec8c90; --cont: #a88a3c; --pos-oh: #3987e5; --pos-mb: #d95926; --pos-opp: #199e70; --pos-s: #c98500; --pos-none: #8a7d74;
            --chip: #332a27; --chip-line: #54453f; --chip-on: #c4485a;
            --warn: #c99a2a; --pending-bg: #6b5a14; --pending-fg: #ffe680;
            --tally: #3e332e; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
            color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --bg: #1d1816; --surface: #28211e; --ink: #f1e7df; --muted: #a8978b; --line: #3d332e;
        --band: #5e1824; --on-band: #fff3ec;
        --score: #5c7646; --score-team: #445c33; --score-text: #9bbb7c;
        --loss: #a9474e; --loss-team: #74222f; --loss-text: #ec8c90; --cont: #a88a3c; --pos-oh: #3987e5; --pos-mb: #d95926; --pos-opp: #199e70; --pos-s: #c98500; --pos-none: #8a7d74;
        --chip: #332a27; --chip-line: #54453f; --chip-on: #c4485a;
        --warn: #c99a2a; --pending-bg: #6b5a14; --pending-fg: #ffe680;
        --tally: #3e332e; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { height: 100%; overscroll-behavior: none; }
    body {
        height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
        background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .tap:active { transform: translateY(1px); filter: brightness(0.9); }
    .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .col { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }

    .view { display: none; height: 100%; }
    .view.active { display: flex; flex-direction: column; }

    /* ===== 分頁畫面（首頁／隊伍／紀錄／數據） ===== */
    .page { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .page-inner { display: flex; flex-direction: column; gap: 14px; padding-block: 16px 24px; }
    .page-title { background: var(--band); color: var(--on-band); border-radius: 12px; padding: 14px 16px; }
    .page-title h1 { margin: 0; font-size: 19px; letter-spacing: 1px; }
    .page-title p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
    .tabbar { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tabbar button { border: none; background: transparent; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .tabbar button i { font-style: normal; font-size: 19px; line-height: 1; }
    .tabbar button.on { color: var(--chip-on); }
    :root[data-theme="dark"] .tabbar button.on { color: #e88a98; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .card h2 { margin: 0; font-size: 16px; }
    .card label, .card .card-label { font-weight: 700; font-size: 15px; }
    .card .note, .note { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .resume-card { border-color: var(--gold); border-width: 2px; }
    .input-text { width: 100%; padding: 11px 12px; border: 1px solid var(--chip-line); border-radius: 8px; font-size: 16px; background: var(--bg); color: var(--ink); -webkit-user-select: auto; user-select: auto; font-family: inherit; }
    textarea.input-text { min-height: 150px; resize: vertical; line-height: 1.5; }
    select.input-text { appearance: auto; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row .input-text { flex: 1; min-width: 0; }
    .btn-solid { border: none; border-radius: 8px; padding: 0 18px; min-height: 44px; font-weight: 700; font-size: 15px; background: var(--score); color: var(--on-btn); }
    .btn-solid.brand { background: var(--band); color: var(--on-band); }
    .btn-solid.ghost { background: transparent; color: var(--ink); border: 1px solid var(--chip-line); }
    .btn-solid.danger { background: var(--loss); color: var(--on-btn); }
    .btn-solid.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
    .btn-solid.block { width: 100%; }
    .btn-start { min-height: 54px; font-size: 18px; border-radius: 12px; }
    .form-msg { font-size: 13px; color: var(--loss-text); min-height: 1em; }
    .form-msg.ok { color: var(--score-text); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seg { display: flex; border: 1px solid var(--chip-line); border-radius: 8px; overflow: hidden; }
    .seg button { flex: 1; border: none; background: transparent; min-height: 40px; font-weight: 700; font-size: 14px; padding: 0 6px; }
    .seg button + button { border-left: 1px solid var(--chip-line); }
    .seg button.on { background: var(--chip-on); color: var(--on-chip-on); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1.5px solid var(--chip-line); background: var(--chip); color: var(--ink); border-radius: 20px; min-height: 38px; padding: 0 14px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .chip.on { background: var(--chip-on); border-color: var(--chip-on); color: var(--on-chip-on); }
    .chip.dim { opacity: 0.5; }
    .chip small { font-weight: 500; opacity: 0.8; font-size: 11px; }
    .list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .list-row { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border: none; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
    .list-row:last-child { border-bottom: none; }
    .list-row .lr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .list-row .lr-title { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .lr-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .lr-num { min-width: 2.2em; text-align: center; font-family: var(--font-score); font-weight: 700; font-size: 20px; color: var(--chip-on); }
    :root[data-theme="dark"] .list-row .lr-num { color: #e88a98; }
    .list-row.dim { opacity: 0.55; }
    .tagx { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: var(--chip); border: 1px solid var(--chip-line); color: var(--muted); }
    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 22px 8px; line-height: 1.6; }
    .teamcols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
    .teamcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .teamcol h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
    .teamcol h3 small { font-size: 11px; color: var(--muted); font-weight: 500; }
    .mrow { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 4px 4px 4px 8px; min-height: 44px; }
    .mrow .mn { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mrow .mn small { color: var(--muted); font-weight: 500; margin-right: 4px; }
    .mrow button { flex: 0 0 auto; border: 1px solid var(--chip-line); background: var(--chip); border-radius: 6px; min-height: 34px; padding: 0 8px; font-size: 12px; font-weight: 700; }
    .mrow button.x { border: none; background: transparent; color: var(--muted); font-size: 16px; padding: 0 6px; }
    .sub-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 6px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-weight: 700; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
    .toggle span { font-weight: 700; font-size: 14px; }
    .toggle .note { display: block; font-weight: 500; }
    .toggle button { flex: 0 0 auto; width: 52px; height: 30px; border-radius: 15px; border: none; background: var(--chip-line); position: relative; padding: 0; }
    .toggle button::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left 0.12s; }
    .toggle button.on { background: var(--score); }
    .toggle button.on::after { left: 25px; }
    .banner-warn { background: var(--pending-bg); color: var(--pending-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 700; }

    /* ===== 場邊紀錄畫面 ===== */
    .band { background: var(--band); color: var(--on-band); flex-shrink: 0; }
    .band-inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding-block: 6px; }
    .hdr-left { display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
    .set-btn { border: none; border-radius: 6px; background: var(--gold); color: var(--on-gold); font-weight: 800; font-size: 13px; padding: 5px 8px; white-space: nowrap; }
    .timer-btn { border: 1px solid var(--band-line); background: var(--band-soft); color: var(--on-band); border-radius: 6px; font-size: 12px; font-weight: 700; padding: 3px 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .timer-btn.running { border-color: var(--gold); color: var(--gold); }
    .hdr-score { text-align: center; min-width: 0; }
    .score-line { display: flex; align-items: baseline; justify-content: center; gap: 4px; line-height: 1; }
    .score-line .num { font-family: var(--font-score); font-weight: 700; font-size: clamp(32px, 10.5vw, 46px); font-variant-numeric: tabular-nums; min-width: 1.1em; }
    .score-line .colon { font-family: var(--font-score); font-size: clamp(24px, 8vw, 36px); opacity: 0.7; }
    .score-line .side { font-size: 13px; font-weight: 700; opacity: 0.8; }
    .band-sub { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 700; padding-bottom: 6px; white-space: nowrap; }
    .band-sub span { overflow: hidden; text-overflow: ellipsis; }
    #setInfo { opacity: 0.85; flex: 0 0 auto; }
    .hdr-right { display: flex; gap: 6px; }
    .icon-btn { border: 1px solid var(--band-line); background: var(--band-soft); color: var(--on-band); border-radius: 8px; width: 46px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; font-size: 20px; line-height: 1; }
    .icon-btn small { font-size: 10px; font-weight: 700; }

    .strip { position: relative; flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 4px; min-height: 52px; }
    .live-tl { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .live-tl::-webkit-scrollbar { display: none; }
    .live-empty { font-size: 12px; color: var(--muted); line-height: 42px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast {
        position: absolute; top: 5px; bottom: 5px;
        left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
        display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; z-index: 3;
        background: var(--ink); color: var(--surface); font-weight: 700; font-size: 15px; pointer-events: none;
    }
    .toast.score { background: var(--score); color: var(--on-btn); }
    .toast.loss { background: var(--loss); color: var(--on-btn); }
    .toast.cont { background: var(--cont); color: var(--on-btn); }
    .toast.banner { background: var(--band); color: var(--on-band); pointer-events: auto; }
    .toast-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toast-btn { margin-left: auto; border: none; border-radius: 6px; background: var(--gold); color: var(--on-gold); font-weight: 800; font-size: 13px; padding: 7px 10px; white-space: nowrap; }
    .toast-x { border: none; background: transparent; color: inherit; font-size: 18px; padding: 4px 2px; opacity: 0.8; }
    .gtoast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 70; max-width: calc(100% - 32px); background: var(--ink); color: var(--surface); font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); pointer-events: none; text-align: center; }

    .pad { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding-block: 8px; overflow: hidden; }
    .court { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
    .crow { flex: 1 1 0; min-height: 36px; max-height: 76px; display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch; }
    .crow.libero-row { grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
    .crow-label { writing-mode: vertical-rl; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 2px; align-self: center; }
    .player-grid { flex: 0 1 auto; display: grid; gap: 6px; grid-auto-rows: clamp(38px, 7.2vh, 56px); grid-auto-rows: clamp(38px, 7.2dvh, 56px); border-radius: 10px; align-content: start; }
    .player-grid + .team-row { margin-top: auto; }
    .pbtn { border: 1.5px solid var(--chip-line); background: var(--chip); color: var(--ink); border-radius: 8px; font-weight: 700; font-size: 15px; line-height: 1.1; padding: 0 2px; display: flex; align-items: center; justify-content: center; gap: 3px; text-align: center; overflow: hidden; word-break: keep-all; min-height: 0; }
    .pbtn .sn { font-size: 11px; font-weight: 800; color: var(--muted); }
    .pbtn .srv { color: var(--chip-on); font-size: 13px; }
    .pbtn.len4 { font-size: 13px; }
    .pbtn.len5 { font-size: 11px; word-break: break-all; }
    .pbtn.empty { border-style: dashed; color: var(--muted); font-weight: 500; }
    .pbtn.sel { background: var(--chip-on); border-color: var(--chip-on); color: var(--on-chip-on); }
    .pbtn.sel .sn, .pbtn.sel .srv { color: var(--on-chip-on); }
    .pbtn.sub { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
    .pbtn.sub small { font-size: 10px; font-weight: 700; opacity: 0.8; }
    .pbtn.dis { opacity: 0.4; }
    .team-row { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; height: clamp(46px, 8.5vh, 62px); height: clamp(46px, 8.5dvh, 62px); }
    .tmbtn { border: none; border-radius: 8px; color: var(--on-btn); font-weight: 800; font-size: 15px; line-height: 1.15; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.14); }
    .tmbtn small { font-size: 10px; font-weight: 600; opacity: 0.85; }
    .tmbtn.good { background: var(--score-team); }
    .tmbtn.bad { background: var(--loss-team); }
    .tmbtn.pend { background: var(--warn); color: var(--on-warn); }
    .tally { flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--line); padding-block: 5px; }
    .tally-inner { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch; }
    .tally-label { font-size: 11px; font-weight: 700; color: var(--muted); writing-mode: vertical-rl; text-align: center; letter-spacing: 2px; }
    .tbtn { border: none; border-radius: 8px; min-height: 38px; background: var(--tally); color: var(--on-btn); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 13px; }
    .tbtn b { font-size: 19px; font-variant-numeric: tabular-nums; font-family: var(--font-score); }

    /* 即時軌跡表（我方 / 對方兩列同一張 table，永遠對齊） */
    .tl-table { border-collapse: collapse; }
    .tl-table th { font-weight: 700; white-space: nowrap; }
    .tl-table td { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tl-table tr.tl-ts th, .tl-table tr.tl-ts td { border: none; background: transparent; font-size: 8px; font-weight: 400; height: 12px; padding: 0; overflow: visible; }
    .tl-live th { position: sticky; left: 0; z-index: 1; width: 34px; min-width: 34px; font-size: 11px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
    .tl-live td { width: 24px; min-width: 24px; height: 21px; padding: 0; font-size: 12px; font-weight: 700; border: 1px solid var(--line); }
    .tl-live tr.tl-me th, .tl-live tr.tl-me td { border-bottom: 1.5px solid var(--muted); }
    .tl-live tr.tl-ts td { color: var(--pending-fg); }
    .tl-live .v-me { color: var(--score-text); }
    .tl-live .v-opp { color: var(--loss-text); }
    .tl-live .pending { background: var(--pending-bg); color: var(--pending-fg); }

    /* ===== Bottom sheet ===== */
    .scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { width: 100%; max-width: 640px; max-height: 88%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--surface); color: var(--ink); border-radius: 16px 16px 0 0;
        padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }

<!-- ============ 分頁畫面：首頁／隊伍／紀錄／數據 ============ -->

<script>
/* ==================================================================
   純邏輯（不碰 DOM、不碰 window）：tests/selftest.mjs 會把下面這一段抽出來在 Node 裡執行
   ================================================================== */
/* @core-begin */

/* ===== CONFIG ===== */
const APP_SCHEMA = 'ntuche-volley';
const DB_VERSION = 1;
const NOT_OURS_MSG = '這不是化工男排的紀錄檔';

const POSITIONS = ['S', 'OH', 'MB', 'OPP', 'L'];
const POS_LABEL = { S: '舉球', OH: '大砲', MB: '攔中', OPP: '舉對', L: '自由' };
const POS_ALIASES = {
    S: ['S', '舉球', '舉', '二傳', '舉球員'],
    OH: ['OH', '大砲', '大炮', '主攻', '邊攻'],
    MB: ['MB', '攔中', '副攻', '中間', '中攻'],
    OPP: ['OPP', '舉對', '背', '對角', '接應'],
    L: ['L', '自由', '自由球員', 'LIBERO', 'LIB']
};
const POS_LOOKUP = (() => {
    const m = {};
    POSITIONS.forEach(code => POS_ALIASES[code].forEach(a => { m[a.toLowerCase()] = code; }));
    return m;
})();
const PLAYER_STATUS = { active: '在隊', graduated: '已畢業', archived: '封存' };

const FORMATS = {
    bo3: { bestOf: 3, setPoints: [25, 25, 15], label: '三局兩勝' },
    bo5: { bestOf: 5, setPoints: [25, 25, 25, 25, 15], label: '五局三勝' }
};
const MAX_SUBS = 6;
const TALLY_KEYS = ['欄中', '背', '大砲'];
const SETS_PER_SHEET = 3;
const TL_PER_LINE = 30;

// 正字紀錄表欄位（順序與欄位名稱完全沿用 v5）
const SCORE_KEYS = ['發球', '攻擊', '吊球', '攔網'];
const LOSS_KEYS = ['發球', '接球', '攻擊', '防守', '二傳', '吊球', '觸網', '攔網', '舉球'];
const LABELS = { '觸網': '觸網越界' };

/* 按鈕 → 事件 → 紀錄表欄位 對照表（畫面按鈕、統計、紀錄表都讀這一張）
   group: score 得分｜loss 失分｜team 免選人｜cont 繼續（這球還沒結束）
   when:  serve 只在我方發球時顯示（有輪轉時只給發球者）｜receive 只在對方發球時顯示 */
const ACTIONS = [
    { id: 's_attack', label: '攻擊', group: 'score', skill: 'attack', out: 'pt', det: 'spike', col: '攻擊' },
    { id: 's_tip', label: '吊球', group: 'score', skill: 'attack', out: 'pt', det: 'tip', col: '吊球' },
    { id: 's_block', label: '攔網', group: 'score', skill: 'block', out: 'pt', det: '', col: '攔網' },
    { id: 's_serve', label: '發球', group: 'score', skill: 'serve', out: 'pt', det: '', col: '發球', when: 'serve' },
    { id: 'l_attack', label: '攻擊', group: 'loss', skill: 'attack', out: 'err', det: 'spike', col: '攻擊' },
    { id: 'l_tip', label: '吊球', group: 'loss', skill: 'attack', out: 'err', det: 'tip', col: '吊球' },
    { id: 'l_block', label: '攔網', group: 'loss', skill: 'block', out: 'err', det: '', col: '攔網' },
    { id: 'l_net', label: '觸網越界', group: 'loss', skill: 'fault', out: 'err', det: 'net', col: '觸網' },
    { id: 'l_receive', label: '接球', group: 'loss', skill: 'receive', out: 'err', det: '', col: '接球', when: 'receive' },
    { id: 'l_dig', label: '防守', group: 'loss', skill: 'dig', out: 'err', det: '', col: '防守' },
    { id: 'l_second', label: '二傳', group: 'loss', skill: 'set', out: 'err', det: 'second', col: '二傳' },
    { id: 'l_setter', label: '舉球', group: 'loss', skill: 'set', out: 'err', det: 'setter', col: '舉球' },
    { id: 'l_serve', label: '發球', group: 'loss', skill: 'serve', out: 'err', det: '', col: '發球', when: 'serve' },
    { id: 't_opp_err', label: '對方失誤', group: 'team', skill: 'team', out: 'opp_err', det: '', col: '對方失誤' },
    { id: 't_opp_pt', label: '對手好球', group: 'team', skill: 'team', out: 'opp_pt', det: '', col: '對手好球' },
    { id: 't_pending', label: '待確認', group: 'team', skill: 'team', out: 'opp_pt', det: '', pending: true },
    { id: 'c_attack', label: '攻擊被守起', group: 'cont', skill: 'attack', out: 'cont', det: 'spike' }
];
const ACTION_BY_ID = {};
ACTIONS.forEach(a => { ACTION_BY_ID[a.id] = a; });

// 依主位置把常用項放前面（只調順序，不隱藏）
const POS_PREF = {
    S: ['l_setter', 'l_second', 's_serve', 'l_serve'],
    OH: ['s_attack', 'l_attack', 'l_receive', 'l_dig'],
    MB: ['s_block', 'l_block', 's_attack', 'l_attack'],
    OPP: ['s_attack', 'l_attack', 's_block', 'l_block'],
    L: ['l_receive', 'l_dig', 'l_second']
};

const DEFAULT_SETTINGS = { teamTitle: '台大化工男排', showTallyRow: true, trackLineupDefault: true, theme: 'system' };

/* ===== UTIL ===== */
function uid(prefix) {
    let r;
    if (typeof crypto !== 'undefined' && crypto && typeof crypto.randomUUID === 'function') r = crypto.randomUUID().replace(/-/g, '').slice(0, 12);
    else r = Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 9);
    return prefix + r;
}
function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
function pad2(n) { return String(n).padStart(2, '0'); }
function dateStr(d) { d = d || new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function fmtClock(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    return `${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`;
}
// 每次改到實體就更新 updatedAt（合併匯入只靠這個時間；保證嚴格遞增）
function touch(obj) {
    const n = Date.now();
    obj.updatedAt = n > (obj.updatedAt || 0) ? n : (obj.updatedAt || 0) + 1;
    return obj;
}
function posLabel(code) { return POS_LABEL[code] || code; }
function actionLabel(a) { return LABELS[a] || a; }

/* ===== SCHEMA ===== */
function newDb() {
    return {
        schema: APP_SCHEMA, version: DB_VERSION, exportedAt: null, deviceId: uid('d_'),
        settings: clone(DEFAULT_SETTINGS),
        players: {}, seasons: {}, teams: {}, matches: {}, matches_conflict: {},
        lastBackupAt: null
    };
}
function newPlayer(f) {
    const n = Date.now();
    const yr = parseInt(f.entryYear, 10);
    return {
        id: uid('p_'),
        name: String(f.name || '').trim(),
        number: String(f.number == null ? '' : f.number).trim(),
        positions: Array.isArray(f.positions) ? f.positions.filter(p => POS_LABEL[p]) : [],
        entryYear: Number.isFinite(yr) ? yr : null,
        status: 'active',
        note: String(f.note || ''),
        createdAt: n, updatedAt: n
    };
}
function newLineup(slots, libero) {
    const s = {};
    for (let i = 1; i <= 6; i++) if (slots && slots[i]) s[i] = slots[i];
    return { system: '5-1', slots: s, libero: libero || null };
}
function cloneLineup(l) {
    if (!l) return null;
    return newLineup(l.slots, l.libero);
}
function lineupComplete(l) {
    if (!l) return false;
    for (let i = 1; i <= 6; i++) if (!l.slots[i]) return false;
    return true;
}
// 這個球員在陣容的哪一格：1～6、'L'（自由）或 null
function lineupFind(l, pid) {
    for (let i = 1; i <= 6; i++) if (l.slots[i] === pid) return i;
    return l.libero === pid ? 'L' : null;
}
// 把球員放進選取的格子（1～6 或 'L'）；他已經在別格就搬過來，原本那格的人換到他原來的位置
function lineupAssign(l, slot, pid) {
    const from = lineupFind(l, pid);
    const occupant = slot === 'L' ? l.libero : l.slots[slot];
    if (slot === 'L') l.libero = pid; else l.slots[slot] = pid;
    if (from !== null && from !== slot) {
        if (from === 'L') l.libero = occupant || null;
        else if (occupant) l.slots[from] = occupant;
        else delete l.slots[from];
    }
    return l;
}
function lineupClear(l, slot) {
    if (slot === 'L') l.libero = null; else delete l.slots[slot];
    return l;
}
// 從 from 的下一格開始找第一個空的號位（1～6）；都滿了回傳 null
function nextEmptySlot(l, from) {
    for (let k = 1; k <= 6; k++) {
        const i = ((Number(from) || 0) + k - 1) % 6 + 1;
        if (!l.slots[i]) return i;
    }
    return null;
}
// positions：這一局開始前確認的位置 { 球員ID: 'OH'|'MB'|'OPP'|'S'|'L' }（有人有雙重位置，配球的「位置」要看他這一局打哪個位置）
function emptySet(no) { return { no, firstServe: null, lineup: null, positions: {}, log: [] }; }
function rosterEntry(p) { return { playerId: p.id, name: p.name, number: p.number, positions: (p.positions || []).slice() }; }
function newMatch(o) {
    const fmt = FORMATS[o.formatKey] || FORMATS.bo3;
    const n = Date.now();
    const sets = [];
    for (let i = 0; i < fmt.bestOf; i++) sets.push(emptySet(i + 1));
    sets[0].firstServe = o.firstServe || null;
    sets[0].lineup = cloneLineup(o.lineup);
    sets[0].positions = o.positions ? clone(o.positions) : {};
    return {
        id: uid('m_'),
        teamId: o.teamId || null,
        opponent: String(o.opponent || '').trim() || '未填寫',
        event: String(o.event || '').trim(),
        date: o.date || dateStr(),
        format: { bestOf: fmt.bestOf, setPoints: fmt.setPoints.slice() },
        roster: (o.roster || []).map(rosterEntry),
        sets, review: {},
        status: 'live',
        recorder: String(o.recorder || '').trim(),
        curSet: 0,
        timer: { ms: 0, since: null },
        createdAt: n, updatedAt: n
    };
}

// 載入（本機或匯入檔）時一律先跑：回傳 { ok, db } 或 { ok:false, error }
function migrate(db) {
    if (!db || typeof db !== 'object' || Array.isArray(db) || db.schema !== APP_SCHEMA) return { ok: false, error: NOT_OURS_MSG };
    const v = Number(db.version);
    if (!(v >= 1)) return { ok: false, error: NOT_OURS_MSG };
    if (v > DB_VERSION) return { ok: false, error: '這份紀錄檔來自較新版本的程式，請先更新程式再匯入' };
    // 之後改格式在這裡加：if (v < 2) { …; db.version = 2; }
    db.version = DB_VERSION;
    db.settings = Object.assign(clone(DEFAULT_SETTINGS), db.settings && typeof db.settings === 'object' ? db.settings : {});
    ['players', 'seasons', 'teams', 'matches', 'matches_conflict'].forEach(k => {
        if (!db[k] || typeof db[k] !== 'object' || Array.isArray(db[k])) db[k] = {};
    });
    if (!db.deviceId) db.deviceId = uid('d_');
    if (db.lastBackupAt === undefined) db.lastBackupAt = null;
    ['players', 'seasons', 'teams', 'matches'].forEach(k => {
        Object.keys(db[k]).forEach(id => {
            const e = db[k][id];
            if (!e || typeof e !== 'object') { delete db[k][id]; return; }
            e.id = id;
            if (typeof e.updatedAt !== 'number') e.updatedAt = typeof e.createdAt === 'number' ? e.createdAt : 0;
            if (typeof e.createdAt !== 'number') e.createdAt = e.updatedAt;
        });
    });
    Object.keys(db.teams).forEach(id => { if (!Array.isArray(db.teams[id].memberIds)) db.teams[id].memberIds = []; });
    Object.keys(db.matches).forEach(id => {
        const m = db.matches[id];
        if (!Array.isArray(m.sets)) m.sets = [];
        m.sets.forEach((s, i) => { if (!Array.isArray(s.log)) s.log = []; if (!s.no) s.no = i + 1; if (s.firstServe === undefined) s.firstServe = null; if (s.lineup === undefined) s.lineup = null; if (!s.positions || typeof s.positions !== 'object') s.positions = {}; });
        if (!m.review || typeof m.review !== 'object') m.review = {};
        if (!Array.isArray(m.roster)) m.roster = [];
        if (!m.format || !Array.isArray(m.format.setPoints)) m.format = { bestOf: FORMATS.bo3.bestOf, setPoints: FORMATS.bo3.setPoints.slice() };
        if (typeof m.curSet !== 'number') m.curSet = 0;
        if (!m.timer || typeof m.timer !== 'object') m.timer = { ms: 0, since: null };
        if (!m.status) m.status = 'live';
        if (m.recorder === undefined) m.recorder = '';
    });
    return { ok: true, db };
}
// 把文字（檔案內容、貼上的文字）解析成資料庫；不覆蓋任何東西
function parseDbText(text) {
    let obj;
    try { obj = JSON.parse(String(text).replace(/^﻿/, '')); } catch (e) { return { ok: false, error: NOT_OURS_MSG }; }
    return migrate(obj);
}

/* ===== 球員庫與隊伍（P2） ===== */
function numKey(n) { const x = parseInt(n, 10); return Number.isFinite(x) ? x : 9999; }
function sortPlayers(list) {
    return list.slice().sort((a, b) => numKey(a.number) - numKey(b.number) || String(a.number).localeCompare(String(b.number)) || a.name.localeCompare(b.name, 'zh-Hant'));
}
// 選單裡能選的球員：只有「在隊」；封存與已畢業的不出現，但舊紀錄照常顯示
function selectablePlayers(db) {
    return sortPlayers(Object.values(db.players).filter(p => p.status === 'active'));
}
function playerHasMatches(db, pid) {
    return Object.values(db.matches).some(m => matchParticipants(m).has(pid));
}
function addPlayerTo(db, f) {
    const p = newPlayer(f);
    db.players[p.id] = p;
    return p;
}
function updatePlayerIn(db, pid, f) {
    const p = db.players[pid];
    if (!p) return null;
    if (f.name !== undefined) p.name = String(f.name).trim();
    if (f.number !== undefined) p.number = String(f.number).trim();
    if (f.positions !== undefined) p.positions = f.positions.filter(c => POS_LABEL[c]);
    if (f.entryYear !== undefined) { const y = parseInt(f.entryYear, 10); p.entryYear = Number.isFinite(y) ? y : null; }
    if (f.status !== undefined && PLAYER_STATUS[f.status]) p.status = f.status;
    if (f.note !== undefined) p.note = String(f.note);
    touch(p);
    return p;
}
function seasonsSorted(db) {
    return Object.values(db.seasons).sort((a, b) => String(b.startDate || '').localeCompare(String(a.startDate || '')) || b.createdAt - a.createdAt);
}
function teamsOfSeason(db, seasonId) {
    return Object.values(db.teams).filter(t => t.seasonId === seasonId).sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant') || a.createdAt - b.createdAt);
}
function teamLabel(db, teamId) {
    const t = db.teams[teamId];
    if (!t) return '（已移除的隊伍）';
    const s = db.seasons[t.seasonId];
    return `${s ? s.name + ' ' : ''}${t.name}`;
}
function nextSeasonName(name) {
    const m = /^(\d+)-(\d+)$/.exec(String(name || '').trim());
    if (!m) return name ? `${name}（新）` : '';
    return Number(m[2]) >= 2 ? `${Number(m[1]) + 1}-1` : `${m[1]}-${Number(m[2]) + 1}`;
}
function addTeamTo(db, seasonId, name) {
    const n = Date.now();
    const t = { id: uid('t_'), seasonId, name, memberIds: [], defaultLineup: null, createdAt: n, updatedAt: n };
    db.teams[t.id] = t;
    return t;
}
// 新增賽季：自動建立 A隊、B隊
function addSeasonTo(db, f) {
    const n = Date.now();
    const s = { id: uid('s_'), name: String(f.name || '').trim(), startDate: f.startDate || dateStr(), createdAt: n, updatedAt: n };
    db.seasons[s.id] = s;
    addTeamTo(db, s.id, 'A隊');
    addTeamTo(db, s.id, 'B隊');
    return s;
}
// 複製上一季：兩隊與在隊成員一併帶過來（已畢業、封存的不帶），預設陣容只保留還在隊上的人
function copySeasonIn(db, fromSeasonId, f) {
    const s = addSeasonTo(db, f);
    const newTeams = teamsOfSeason(db, s.id);
    teamsOfSeason(db, fromSeasonId).forEach(src => {
        let dst = newTeams.find(t => t.name === src.name);
        if (!dst) dst = addTeamTo(db, s.id, src.name);
        dst.memberIds = src.memberIds.filter(pid => db.players[pid] && db.players[pid].status === 'active');
        dst.defaultLineup = cleanLineup(src.defaultLineup, dst.memberIds);
    });
    return s;
}
function cleanLineup(l, memberIds) {
    if (!l) return null;
    const ok = pid => pid && memberIds.indexOf(pid) !== -1;
    const slots = {};
    for (let i = 1; i <= 6; i++) if (ok(l.slots[i])) slots[i] = l.slots[i];
    const out = newLineup(slots, ok(l.libero) ? l.libero : null);
    return Object.keys(out.slots).length || out.libero ? out : null;
}
// 把球員放進某隊（同一賽季只會在一隊：從另一隊拿掉）。球員 ID 不變，生涯數據自動跟著走。
function moveMemberIn(db, pid, toTeamId) {
    const to = db.teams[toTeamId];
    if (!to || !db.players[pid]) return false;
    teamsOfSeason(db, to.seasonId).forEach(t => {
        if (t.id === toTeamId) return;
        const i = t.memberIds.indexOf(pid);
        if (i !== -1) {
            t.memberIds.splice(i, 1);
            t.defaultLineup = cleanLineup(t.defaultLineup, t.memberIds);
            touch(t);
        }
    });
    if (to.memberIds.indexOf(pid) === -1) to.memberIds.push(pid);
    touch(to);
    return true;
}
function removeMemberIn(db, pid, teamId) {
    const t = db.teams[teamId];
    if (!t) return false;
    const i = t.memberIds.indexOf(pid);
    if (i === -1) return false;
    t.memberIds.splice(i, 1);
    t.defaultLineup = cleanLineup(t.defaultLineup, t.memberIds);
    touch(t);
    return true;
}
function playerTeamHistory(db, pid) {
    const out = [];
    Object.values(db.teams).forEach(t => {
        if (t.memberIds.indexOf(pid) !== -1) out.push({ team: t, season: db.seasons[t.seasonId] || null });
    });
    out.sort((a, b) => String((b.season && b.season.startDate) || '').localeCompare(String((a.season && a.season.startDate) || '')));
    return out;
}
// 快速匯入名單：每行「背號 姓名 位置」，順序彈性（背號可以在前或在後；位置可以多個，用 / 隔開）
function parseRosterText(text) {
    const rows = [];
    String(text || '').split(/\r?\n/).forEach((raw, idx) => {
        const line = raw.trim();
        if (!line) return;
        const toks = line.split(/[\s,，、;；\t]+/).filter(Boolean);
        let number = null, positions = [], nameParts = [];
        toks.forEach(tk => {
            const t = tk.replace(/^[#＃]/, '');
            if (number === null && /^\d{1,3}$/.test(t)) { number = t; return; }
            const codes = t.split(/[\/／+]/).map(x => POS_LOOKUP[x.toLowerCase()]);
            if (codes.length && codes.every(Boolean)) { codes.forEach(c => { if (positions.indexOf(c) === -1) positions.push(c); }); return; }
            nameParts.push(t);
        });
        const name = nameParts.join(' ').trim();
        if (!name) rows.push({ line: idx + 1, raw: line, ok: false, error: '找不到姓名' });
        else rows.push({ line: idx + 1, raw: line, ok: true, name, number: number === null ? '' : number, positions });
    });

    const P = pid => players[pid] || (players[pid] = blankStat(pid));
    const team = blankStat(null);
    team.points = { 攻擊: 0, 吊球: 0, 攔網: 0, 發球: 0, 對方失誤: 0 };
    team.losses = { 發球: 0, 接球: 0, 攻擊: 0, 防守: 0, 二傳: 0, 吊球: 0, 觸網: 0, 攔網: 0, 舉球: 0, 對手好球: 0, 待確認: 0 };
    let tracked = 0, rallies = 0, pendingCount = 0;
    const tally = { 欄中: 0, 背: 0, 大砲: 0 };   // 舊版賽中配球列的計數（新版改在覆盤時記配球，見 dist）
    const dist = blankDist();
    const runs = { us: { n: 0, set: null }, them: { n: 0, set: null } };
    const setRows = [];

    match.sets.forEach((set, i) => {
        if (only !== null && i !== only) return;
        const st = replaySet(set, match);
        // 進行中這一球已記的「攻擊被守起」也算進攻擊總數
        st.openRally.forEach(ev => { if (ev.skill === 'attack' && ev.p) { team.attack.dug++; P(ev.p).attack.dug++; } });
        setRows.push({ no: i + 1, score: st.score, tracked: st.tracked });
        if (st.tracked) tracked++;

        let cu = 0, ct = 0;
        st.rallies.forEach(r => {
            rallies++;

            else { ct++; cu = 0; if (ct > runs.them.n) runs.them = { n: ct, set: i + 1 }; }
            if (r.serve === 'us' && r.server) {
                const ps = P(r.server);
                ps.serve.total = (ps.serve.total || 0) + 1;
                team.serve.total = (team.serve.total || 0) + 1;
            }
            const rv = review[r.id] || null;
            r.events.forEach(ev => {
                const a = findAction(ev);
                const ps = ev.p ? P(ev.p) : null;
                if (ev.out === 'cont') {
                    if (ev.skill === 'attack') { team.attack.dug++; if (ps) ps.attack.dug++; }
                    return;
                }
                if (ev.out === 'pt') {
                    team.pts++; if (ps) ps.pts++;
                    if (ev.skill === 'attack') { team.attack.pt++; if (ps) ps.attack.pt++; }
                    if (ev.skill === 'serve') { team.serve.pt++; if (ps) ps.serve.pt++; }
                    if (ev.skill === 'block') { team.block.pt++; if (ps) ps.block.pt++; }
                    if (a && a.col) addCount(team.points, a.col);
                } else if (ev.out === 'opp_err') {
                    team.pts++; addCount(team.points, '對方失誤');
                } else if (ev.out === 'err') {
                    team.loss++; if (ps) ps.loss++;
                    if (ev.skill === 'attack') { team.attack.err++; if (ps) ps.attack.err++; }
                    if (ev.skill === 'serve') { team.serve.err++; if (ps) ps.serve.err++; }
                    if (ev.skill === 'block') { team.block.err++; if (ps) ps.block.err++; }
                    if (a && a.col) addCount(team.losses, a.col);
                } else if (ev.out === 'opp_pt') {
                    team.loss++;

                }
            });
            // 第 3 層：只計已覆盤的球
            if (rv && rv.reviewed) {
                (rv.attacksDug || []).forEach(pid => { team.attack.dug++; P(pid).attack.dug++; });
                const end = r.end;
                if (rv.receive && rv.receive.p) {
                    const k = normGrade(rv.receive.grade);
                    P(rv.receive.p).receive[k]++; team.receive[k]++;
                } else if (end.skill === 'receive' && end.out === 'err' && end.p) {
                    P(end.p).receive.err++; team.receive.err++;
                }
                const digs = rv.digs || [];
                digs.forEach(d => {
                    const k = d.ok ? 'ok' : 'no', q = d.ok ? normQuality(d.q) : '';
                    P(d.p).dig[k]++; team.dig[k]++;
                    const ty = DIG_TYPES.some(t => t[0] === d.type) ? d.type : '';
                    [P(d.p).dig, team.dig].forEach(x => { (x.types[ty] || (x.types[ty] = { ok: 0, no: 0 }))[k]++; });
                    if (q) { P(d.p).dig[q]++; team.dig[q]++; }
                });
                // 配球：這一球舉給誰（被配球的人），位置用「那一局」確認的位置
                const setter = (rv.setTo || []).length ? setterOf(match, i, r.id, db) : null;
                (rv.setTo || []).forEach(raw => {
                    const { p: pid, q } = setEntry(raw);
                    const pos = positionOf(match, i, pid, db);
                    if (q) {
                        dist.q[q]++; team.setQ[q]++;
                        (dist.byPlayerQ[pid] || (dist.byPlayerQ[pid] = { good: 0, bad: 0, err: 0 }))[q]++;
                        if (setter) P(setter).setQ[q]++;
                    }
                    dist.total++; dist.byPos[pos] = (dist.byPos[pos] || 0) + 1; dist.byPlayer[pid] = (dist.byPlayer[pid] || 0) + 1;
                    const pp = dist.byPlayerPos[pid] || (dist.byPlayerPos[pid] = {}); pp[pos] = (pp[pos] || 0) + 1;
                    P(pid).setTo++; team.setTo++;
                });
                if (end.skill === 'dig' && end.out === 'err' && end.p && !digs.some(d => d.p === end.p && !d.ok)) {
                    P(end.p).dig.no++; team.dig.no++;
                }
            }
        });
    });
    Object.values(players).forEach(p => {
        p.serve.total = tracked ? (p.serve.total || 0) : null;
        finalizeStat(p);
    });
    team.serve.total = tracked ? (team.serve.total || 0) : null;
    finalizeStat(team);
    team.attack.noteHigh = team.attack.total > 0 && team.attack.dug === 0;
    // 球員順序：先照登錄名單，再來才是其他有紀錄的
    const order = match.roster.map(r => r.playerId).filter(id => players[id]);
    Object.keys(players).forEach(id => { if (order.indexOf(id) === -1) order.push(id); });
    return { team, players, order, tracked: tracked > 0, rallies, pendingCount, tally, dist, runs, sets: setRows };
}
// 一位球員跨多場的累計；rows 是每場一列

        if (f.status && m.status !== f.status) return false;

}

/* ===== 匯出／匯入與合併 ===== */

// 單場分享：只帶那一場，加上它用到的球員、隊伍、賽季

function dbIsEmpty(db) {

// 某一場的紀錄是否「包含」另一份的全部紀錄（只是記得比較多）

}
const MERGE_KINDS = ['players', 'seasons', 'teams', 'matches'];
// 只算計畫、不改資料：每個實體 add（本機沒有）／update（匯入的較新）／keep（本機較新）／same
function planMerge(local, incoming) {

            if (!a) { items.push({ kind, id, action: 'add', conflict: false }); return; }
            if (a.updatedAt === b.updatedAt) { items.push({ kind, id, action: 'same', conflict: false }); return; }
            const incomingNewer = b.updatedAt > a.updatedAt;

            if (kind === 'matches') conflict = incomingNewer ? !logExtends(b, a) : !logExtends(a, b);
            items.push({ kind, id, action: incomingNewer ? 'update' : 'keep', conflict });

}

    plan.items.forEach(it => { c[it.kind][it.action]++; if (it.conflict) c[it.kind].conflict++; });

}
// 匯入前的預覽文字（使用者看過、確認才寫入）
function describeMerge(plan, incoming, local) {
    const c = mergeCounts(plan), parts = [];
    const push = (n, text) => { if (n) parts.push(text.replace('{n}', n)); };
    push(c.matches.add, '新增比賽 {n} 場');
    push(c.matches.update, '更新比賽 {n} 場');
    push(c.players.add, '新增球員 {n} 位');
    push(c.players.update, '更新球員 {n} 位');
    push(c.seasons.add, '新增賽季 {n} 個');
    push(c.teams.add, '新增隊伍 {n} 支');
    push(c.teams.update, '更新隊伍 {n} 支');
    push(c.seasons.update, '更新賽季 {n} 個');
    const lines = [];
    const changes = parts.length;
    if (parts.length) lines.push(parts.join('、'));
    const keeps = c.matches.keep + c.players.keep + c.seasons.keep + c.teams.keep;
    if (keeps) lines.push(`本機的版本比較新，略過 ${keeps} 筆。`);
    plan.items.filter(it => it.conflict).forEach(it => {
        const m = incoming.matches[it.id];
        lines.push(`這場比賽兩邊都有改過：vs ${m.opponent}（${it.action === 'update' ? '保留匯入的較新版本' : '保留本機的較新版本'}，另一份會放進暫存區，可在首頁還原）`);
    });
    if (plan.conflictsToAdd.length) lines.push(`另外帶入 ${plan.conflictsToAdd.length} 份暫存的衝突版本。`);
    const noop = !changes && !plan.conflictsToAdd.length && !plan.items.some(it => it.conflict);
    if (noop) lines.push('這份紀錄檔的內容本機都已經有了，不需要匯入。');
    return { lines, noop, counts: c };
}
function applyMerge(local, incoming, plan) {
    if (plan.adoptSettings) local.settings = Object.assign(clone(DEFAULT_SETTINGS), clone(incoming.settings));
    plan.items.forEach(it => {
        if (it.action === 'same') return;
        const inc = incoming[it.kind][it.id];
        if (it.conflict) {
            const cid = uid('c_');
            const loser = it.action === 'update' ? local[it.kind][it.id] : inc;
            local.matches_conflict[cid] = { id: cid, matchId: it.id, at: Date.now(), match: clone(loser) };
        }
        if (it.action === 'add' || it.action === 'update') local[it.kind][it.id] = clone(inc);
    });
    plan.conflictsToAdd.forEach(cid => { local.matches_conflict[cid] = clone(incoming.matches_conflict[cid]); });
    return local;
}
// 還原暫存區裡被覆蓋的那一份（目前的那份換進暫存區）
function restoreConflict(db, cid) {

    const cur = db.matches[c.matchId];
    if (cur) db.matches_conflict[cid] = { id: cid, matchId: c.matchId, at: Date.now(), match: clone(cur) };
    else delete db.matches_conflict[cid];

/* ===== 跨場分析（P6） ===== */
function matchHasRallies(m) { return m.sets.some(st => st.log.some(e => e.k === 'ev' && e.out !== 'cont')); }
function matchHasReview(m) { return Object.values(m.review || {}).some(r => r && r.reviewed); }
// 篩選：teamName（A隊／B隊，跨賽季）、seasonId、event、from／to（日期）、reviewedOnly；回傳依日期由舊到新
function filterMatches(db, f) {
    const q = f || {};
    return Object.values(db.matches).filter(m => {
        if (!matchHasRallies(m)) return false;
        const t = db.teams[m.teamId];
        if (q.teamName && (!t || t.name !== q.teamName)) return false;
        if (q.seasonId && (!t || t.seasonId !== q.seasonId)) return false;
        if (q.event && m.event !== q.event) return false;
        if (q.from && String(m.date) < q.from) return false;
        if (q.to && String(m.date) > q.to) return false;
        if (q.reviewedOnly && !matchHasReview(m)) return false;
        return true;
    }).sort((a, b) => String(a.date).localeCompare(String(b.date)) || a.createdAt - b.createdAt);
}
// 我方失誤 = 歸給我方的失分（不含對手好球、待確認）
function errorsOf(team) { return team.loss - (team.losses['對手好球'] || 0) - (team.losses['待確認'] || 0); }
function round1(x) { return Math.round(x * 10) / 10; }
function matchBrief(m, sum) { return { id: m.id, date: m.date, opponent: m.opponent, teamId: m.teamId, setsUs: sum.us, setsThem: sum.them, result: sum.done ? (sum.winner === 'us' ? '勝' : '敗') : null }; }
// 多場累計：戰績、全隊、每位球員（同一個球員 ID 跨隊伍自動合併）、每場一點的趨勢
function computeAggregate(db, matches) {

    let setsUs = 0, setsThem = 0, ptsUs = 0, ptsThem = 0, noteHighMatches = 0, reviewedMatches = 0;
    matches.forEach(m => {
        const ms = computeMatchStats(m, db), sum = matchSummary(m);
        addStat(team, ms.team);
        addDist(dist, ms.dist);
        ['points', 'losses'].forEach(k => Object.keys(ms.team[k]).forEach(c => { team[k][c] = (team[k][c] || 0) + ms.team[k][c]; }));
        if (sum.done) { if (sum.winner === 'us') record.w++; else record.l++; } else record.open++;
        setsUs += sum.us; setsThem += sum.them;

        matchParticipants(m).forEach(pid => { if (ids.indexOf(pid) === -1) ids.push(pid); });
        ids.forEach(pid => {

            const e = players[pid];

// 累計個人表排序：h 是欄位名稱、'games' 或 'name'；沒有資料（null）一律排最後
function sortAggPlayers(list, h, dir, nameOf) {
    const col = STAT_COLUMNS.find(c => c.h === h);
    const val = e => h === 'games' ? e.games : col ? col.get(e.stat) : 0;
    const sgn = dir === 'asc' ? 1 : -1;
    return list.slice().sort((a, b) => {
        if (h === 'name') return sgn * String(nameOf(a.pid)).localeCompare(String(nameOf(b.pid)), 'zh-Hant');
        const x = val(a), y = val(b);
        if (x == null && y == null) return 0;
        if (x == null) return 1;
        if (y == null) return -1;

// 最近一場 vs 上一場：數字、每局平均、與上一場每局平均的差

    const pack = m => { const sum = matchSummary(m), ms = computeMatchStats(m, db); return { m, sum, ms, n: Math.max(1, sum.sets.filter(x => x.started).length) }; };
    const A = pack(matches[matches.length - 1]), B = matches.length > 1 ? pack(matches[matches.length - 2]) : null;

    ];

/* ===== 覆盤（P5）：覆盤資料另外存在 match.review，不改動 log ===== */
// 品質分級（接發與起球共用同一把尺）：

const QUALITY_LEVELS = [['good', '到位'], ['run', '需要跑動'], ['bad', '壞球']];

    T('模擬整場對帳：報告數字與手算（逐筆計數）一致', () => {
        let seed = 20261019;
        const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        const ids = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'];
        const m = newMatch({ formatKey: 'bo3', date: '2026-10-19', opponent: '對帳隊' });
        m.roster = ids.map(id => ({ playerId: id, name: id, number: '', positions: [] }));
        const SC = ['s_serve', 's_attack', 's_tip', 's_block'], LS = ['l_serve', 'l_receive', 'l_attack', 'l_dig', 'l_second', 'l_tip', 'l_net', 'l_block', 'l_setter'];
        // 手算用的計數器：只看「點了什麼」，不經過任何推導函式
        const H = { pts: {}, loss: {}, atkPt: {}, atkErr: {}, dug: {}, srvPt: {}, srvErr: {}, blkPt: {}, blkErr: {}, src: {}, lossSrc: {}, us: 0, them: 0, pend: 0 };
        const add = (o, k) => { o[k] = (o[k] || 0) + 1; };
        const setScores = [];
        [25, 25, 15].forEach((target, si) => {
            let us = 0, them = 0;
            while (!((us >= target && us - them >= 2) || (them >= target && them - us >= 2))) {
                const p = ids[Math.floor(rnd() * 8)];
                if (rnd() < 0.35) { m.sets[si].log.push(buildEvent('c_attack', ids[Math.floor(rnd() * 8)])); add(H.dug, m.sets[si].log[m.sets[si].log.length - 1].p); }
                const win = rnd() < 0.55, r = rnd();
                let id, pid = p;
                if (win) {
                    us++; H.us++;
                    if (r < 0.2) { id = 't_opp_err'; pid = null; add(H.src, '對方失誤'); }
                    else { id = SC[Math.floor(rnd() * 4)]; const a = ACTION_BY_ID[id]; add(H.pts, p); add(H.src, a.col); if (a.skill === 'attack') add(H.atkPt, p); if (a.skill === 'serve') add(H.srvPt, p); if (a.skill === 'block') add(H.blkPt, p); }
                } else {
                    them++; H.them++;
                    if (r < 0.2) { id = 't_opp_pt'; pid = null; add(H.lossSrc, '對手好球'); }
                    else if (r < 0.25) { id = 't_pending'; pid = null; add(H.lossSrc, '待確認'); H.pend++; }

/* ===== STORAGE：IndexedDB 為主，localStorage 備援 ===== */
const Storage = (() => {
    const DB_NAME = 'ntuche-volley', STORE_NAME = 'kv', KEY = 'db', LS_KEY = 'ntuche-volley-db';
    let idbPromise = null;
    function openIdb() {
        if (idbPromise) return idbPromise;
        idbPromise = new Promise((resolve, reject) => {
            let done = false;
            const fail = e => { if (!done) { done = true; reject(e); } };
            const timer = setTimeout(() => fail(new Error('timeout')), 4000);
            try {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NAME); };
                req.onsuccess = () => { if (!done) { done = true; clearTimeout(timer); resolve(req.result); } };
                req.onerror = () => fail(req.error || new Error('idb error'));
                req.onblocked = () => fail(new Error('idb blocked'));
            } catch (e) { fail(e); }
        });
        idbPromise.catch(() => { idbPromise = null; });
        return idbPromise;
    }
    async function idbGet() {
        const d = await openIdb();
        return new Promise((resolve, reject) => {
            const r = d.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(KEY);
            r.onsuccess = () => resolve(r.result || null);
            r.onerror = () => reject(r.error);
        });
    }
    async function idbPut(wrapper) {
        const d = await openIdb();
        return new Promise((resolve, reject) => {
            const tx = d.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(wrapper, KEY);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('aborted'));
        });
    }
    function lsGet() { try { const v = localStorage.getItem(LS_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
    function lsPut(wrapper) { try { localStorage.setItem(LS_KEY, JSON.stringify(wrapper)); return true; } catch (e) { return false; } }
    function lsDel() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }
    return {
        // 兩邊都看，取比較新的那份（頁面被關掉時 localStorage 的同步備份可能比 IndexedDB 新）
        async load() {
            let a = null, b = lsGet();
            try { a = await idbGet(); } catch (e) { a = null; }
            const pick = [a, b].filter(w => w && w.db).sort((x, y) => (y.savedAt || 0) - (x.savedAt || 0))[0];
            return pick ? pick.db : null;
        },
        async save(db) {
            const w = { savedAt: Date.now(), db };
            try { await idbPut(w); lsDel(); return true; } catch (e) { /* 改用 localStorage */ }
            return lsPut(w);
        },
        // 頁面要關掉時：同步寫一份 localStorage，IndexedDB 的非同步寫入可能來不及
        saveSync(db) { lsPut({ savedAt: Date.now(), db }); }
    };
})();

/* ===== STORE：唯一狀態；任何修改都透過 commit ===== */
let DB = newDb();
const Store = {
    listeners: [], saveTimer: null, dirty: false, saveError: false, loaded: false,
    subscribe(fn) { this.listeners.push(fn); },
    notify() { this.listeners.forEach(fn => fn()); },
    commit(mutator) {
        mutator(DB);
        this.dirty = true;
        this.notify();
        clearTimeout(this.saveTimer);
        this.saveTimer = setTimeout(() => this.flush(), 300);
    },
    async flush() {
        clearTimeout(this.saveTimer);
        if (!this.dirty || !this.loaded) return;
        this.dirty = false;
        const ok = await Storage.save(DB);
        if (ok === false && !this.saveError) { this.saveError = true; this.notify(); }
        else if (ok !== false && this.saveError) { this.saveError = false; this.notify(); }
    },
    flushSync() { if (this.dirty && this.loaded) Storage.saveSync(DB); this.flush(); }
};
const commit = fn => Store.commit(fn);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushSync(); });

// 依序嘗試：分享選單（手機）→ <a download> → claude.ai 的 downloads；回傳 'share'｜'download'｜'claude'｜'cancelled'｜false
async function saveFile(filename, blob) {
    if (isMobile && navigator.canShare && navigator.share) {
        try {
            const file = new File([blob], filename, { type: blob.type });
            if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return 'share'; }
        } catch (e) {
            if (e && e.name === 'AbortError') return 'cancelled';
        }
    }
    if (!inFrame) {
        try {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            return 'download';
        } catch (e) { /* 換下一個 */ }
    }
    const dl = await downloadsReady;
    if (dl) {
        try { await dl.save({ filename, data: blob }); return 'claude'; }
        catch (e) { if (e && e.code === 'declined') return 'cancelled'; }
    }
    return false;
}

function leInit(lineup, candidates) {

}
function lePlayer(pid) { return DB.players[pid] || null; }
function leSlotHtml(le, slot, label) {
    const pid = slot === 'L' ? le.lineup.libero : le.lineup.slots[slot];
    const p = pid ? lePlayer(pid) : null;
    return `<button type="button" class="le-slot${p ? '' : ' empty'}${le.sel === slot ? ' sel' : ''}" data-action="le-slot" data-slot="${slot}"><small>${label}</small>${p ? `${esc(p.name)}` : '選擇'}</button>`;
}

    const le = ui.le;
    const row = slots => `<div class="le-court">${slots.map(s => leSlotHtml(le, s, `${s} 號位`)).join('')}</div>`;
    const chips = le.candidates.map(pid => {

        return `<button type="button" class="chip${at !== null ? ' on' : ''}" data-action="le-pick" data-id="${esc(pid)}">${esc(p.name)}${at !== null ? `<small>${at === 'L' ? '自由' : at + '號'}</small>` : ''}</button>`;

let wakeLock = null;
async function keepAwake() {
    try {
        if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
    } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && topView() === 'live') keepAwake(); });
function liveMatch() { return DB.matches[ui.live.matchId] || null; }
function timerMs(m) { return m.timer && m.timer.since ? m.timer.ms + (Date.now() - m.timer.since) : (m.timer ? m.timer.ms : 0); }
function timerStr(m) { return fmtClock(timerMs(m)); }
function updateTimerBtn() {
    const m = liveMatch();
    if (!m) return;
    const b = $('#timerBtn'), running = !!m.timer.since;
    b.textContent = `${running ? '⏸' : '▶'} ${timerStr(m)}`;
    b.classList.toggle('running', running);
}
setInterval(() => { if (topView() === 'live') updateTimerBtn(); }, 500);
ACT['timer-toggle'] = () => {

    commit(db => {
        const mm = db.matches[m.id];
        mm.timer = mm.timer.since ? { ms: timerMs(mm), since: null } : { ms: mm.timer.ms, since: Date.now() };
        touch(mm);
    });
};
// 計時器開著時頁面被關掉：兩小時內回來就接著跑，超過就停在最後一次存檔的時間
function fixTimer(m) {
    if (m.timer && m.timer.since && Date.now() - m.updatedAt > 2 * 3600 * 1000) {
        commit(db => { const mm = db.matches[m.id]; mm.timer = { ms: mm.timer.ms + Math.max(0, mm.updatedAt - mm.timer.since), since: null }; touch(mm); });
    }
}
function openLive(id) {
    const m = DB.matches[id];
    if (!m) return;
    fixTimer(m);
    ui.live = { matchId: id, selected: null };
    hideToast();
    if (topView() !== 'live') pushView('live'); else render();
    keepAwake();

    const ts = ev.pending && ev.ts ? `（${ev.ts}）` : '';

/* ===== SHEET：正字紀錄表（版面沿用 v5；資料來自事件流） ===== */
// 正字記號：每 5 次一個「正」，筆順 一 → 丨 → 一(右短橫) → 丨(左短豎) → 一(底橫)；線條屬性寫在 SVG 本身，存成圖片時才不會掉
const ZHENG_STROKES = ['M3 3.5H17', 'M10 3.5V16.5', 'M10 10H15.5', 'M5 10V16.5', 'M2 16.5H18'];
function zhengGlyph(strokes) {
    return `<svg class="zg" width="15" height="15" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="${ZHENG_STROKES.slice(0, strokes).join('')}" fill="none" stroke="${PAPER_INK}" stroke-width="2.2" stroke-linecap="square"/></svg>`;
}
function zhengTally(n) {
    if (!n) return '';
    let html = '';
    for (let i = 0; i < Math.floor(n / 5); i++) html += zhengGlyph(5);
    if (n % 5) html += zhengGlyph(n % 5);
    return `<span class="zg-wrap" title="${n}">${html}</span>`;
}
// 流水比分：一欄一球，我方得分寫在「我方」列、對方得分寫在「對方」列；每一行是獨立的一張 table，兩列永遠對齊
function timelineTable(items, padTo, cls) {
    const showTs = items.some(t => t.isPending && t.timestamp);
    let tsRow = '', meRow = '', oppRow = '';
    items.forEach(t => {
        if (t.team === 'me') {
            tsRow += '<td></td>';
            meRow += `<td class="v-me">${t.val}</td>`;
            oppRow += '<td></td>';
        } else {
            tsRow += `<td>${(t.isPending && t.timestamp) ? t.timestamp : ''}</td>`;
            meRow += '<td></td>';
            oppRow += `<td class="v-opp${t.isPending ? ' pending' : ''}">${t.val}</td>`;
        }
    });
    for (let i = items.length; i < padTo; i++) { tsRow += '<td></td>'; meRow += '<td></td>'; oppRow += '<td></td>'; }
    let html = `<table class="tl-table ${cls}">`;
    if (showTs) html += `<tr class="tl-ts"><th>時間</th>${tsRow}</tr>`;
    html += `<tr class="tl-me"><th>我方</th>${meRow}</tr>`;
    html += `<tr class="tl-opp"><th>對方</th>${oppRow}</tr>`;
    return html + '</table>';
}
function sheetBlockCount(match) { return Math.max(1, Math.ceil(match.sets.length / SETS_PER_SHEET)); }
// 一張紀錄表（最多 3 局；五局制第 4、5 局另起一張同格式的表）
function buildSheetHtml(match, block) {
    const v = s => s.split('').join('<br>');
    const sc = sheetCounts(match), sum = matchSummary(match);
    const idx = [0, 1, 2].map(k => block * SETS_PER_SHEET + k);
    const ids = match.roster.map(r => r.playerId);
    Object.keys(sc.byPlayer).forEach(id => { if (ids.indexOf(id) === -1) ids.push(id); });
    const rows = Math.max(1, ids.length);
    let head1 = '', head2 = '', sub = '';
    idx.forEach(si => {
        head1 += `<th colspan="15" class="ss">${si < match.sets.length ? si + 1 : ''}</th>`;
        head2 += '<th colspan="5" class="ss">得分</th><th colspan="10" class="ls">失分</th>';
        sub += SCORE_KEYS.map((k, j) => `<th${j === 0 ? ' class="ss"' : ''}>${v(k)}</th>`).join('') + `<th>${v('對方失誤')}</th>`;
        sub += LOSS_KEYS.map((k, j) => `<th${j === 0 ? ' class="ls"' : ''}>${v(k)}</th>`).join('') + `<th>${v('對手好球')}</th>`;
    });
    let body = '';
    for (let r = 0; r < rows; r++) {
        const pid = ids[r];
        body += `<tr><td class="nm">${pid ? esc(nameOfIn(match, DB, pid)) : ''}</td>`;
        idx.forEach(si => {
            const per = pid && sc.byPlayer[pid] && sc.byPlayer[pid][si];
            SCORE_KEYS.forEach((k, j) => { body += `<td${j === 0 ? ' class="ss"' : ''}>${per ? zhengTally(per.score[k]) : ''}</td>`; });
            if (r === 0) body += `<td rowspan="${rows}" class="tm">${sc.team[si] ? zhengTally(sc.team[si].oppErr) : ''}</td>`;
            LOSS_KEYS.forEach((k, j) => { body += `<td${j === 0 ? ' class="ls"' : ''}>${per ? zhengTally(per.loss[k]) : ''}</td>`; });
            if (r === 0) body += `<td rowspan="${rows}" class="tm">${sc.team[si] ? zhengTally(sc.team[si].oppGood) : ''}</td>`;
        });
        body += '</tr>';
    }
    // 比分軌跡：每局都印出來（像紙本表格），每局至少兩行，右邊是該局比數
    let tl = '';
    idx.forEach(si => {
        if (si >= match.sets.length) return;
        const line = sc.timelines[si];
        const nLines = Math.max(2, Math.ceil(line.length / TL_PER_LINE));
        let lines = '';
        for (let l = 0; l < nLines; l++) lines += timelineTable(line.slice(l * TL_PER_LINE, (l + 1) * TL_PER_LINE), TL_PER_LINE, 'tl-paper');
        const score = line.length ? `${sc.scores[si].us} : ${sc.scores[si].them}` : ':';
        tl += `<div class="tls"><div class="tls-num">${si + 1}</div><div class="tll">${lines}</div><div class="tls-score"><span>比數</span><b>${score}</b></div></div>`;
    });
    const [y, mo, d] = String(match.date || '').split('-');
    const dateZh = y ? `${y} 年 ${Number(mo)} 月 ${Number(d)} 日` : '　　年　　月　　日';
    const anyRally = sc.timelines.some(t => t.length);
    const matchScore = anyRally ? `${sum.us} : ${sum.them}` : '';
    return `<div class="ph"><div>${dateZh}</div><h1>${esc(DB.settings.teamTitle)}比賽紀錄表</h1>
            <div class="r">對手：${esc(match.opponent)}　比數：<u>${matchScore}</u>　紀錄：<u>${esc(match.recorder)}</u></div></div>
        <table class="st">
            <colgroup><col class="c-name">${'<col>'.repeat(45)}</colgroup>
            <thead>
                <tr><th rowspan="3">局數<br><br>姓名</th>${head1}</tr>
                <tr>${head2}</tr>
                <tr>${sub}</tr>
            </thead>
            <tbody>${body}</tbody>
        </table>
        <div class="tlc">${tl}</div>`;
}

async function renderSheetCanvases(match) {
    await loadScript(LIBS.html2canvas);
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-20000px;top:0;width:1080px;';
    const papers = [];
    for (let b = 0; b < sheetBlockCount(match); b++) {
        const paper = document.createElement('div');
        paper.className = 'paper export';
        paper.innerHTML = buildSheetHtml(match, b);
        host.appendChild(paper); papers.push(paper);
    }
    document.body.appendChild(host);
    try {
        const out = [];
        for (const p of papers) out.push(await window.html2canvas(p, { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true }));
        return out;
    } finally { host.remove(); }
}
function stackCanvases(list) {
    if (list.length === 1) return list[0];
    const w = Math.max(...list.map(c => c.width)), gap = 24;
    const h = list.reduce((a, c) => a + c.height, 0) + gap * (list.length - 1);
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    const g = out.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    let y = 0;
    list.forEach(c => { g.drawImage(c, 0, y); y += c.height + gap; });
    return out;
}
function sheetFileBase(m) { return `化工男排紀錄_vs${m.opponent}_${m.date}`.replace(/[\\/:*?"<>|\s]+/g, ''); }
async function exportSheet(kind) {
    const m = DB.matches[ui.preview.matchId];
    if (!m) return;
    const btns = [$('#pvPng'), $('#pvPdf')];
    btns.forEach(b => { b.disabled = true; });
    setPvMsg(kind === 'pdf' ? '正在產生 PDF…' : '正在產生圖片…');
    try {
        const canvases = await renderSheetCanvases(m);
        if (kind === 'png') {
            const canvas = stackCanvases(canvases);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            const r = await saveFile(sheetFileBase(m) + '.png', blob);
            if (r === false) showImage(canvas);
            else setPvMsg(r === 'cancelled' ? '已取消存檔' : `已存檔：${sheetFileBase(m)}.png`);
        } else {
            await loadScript(LIBS.jspdf);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
            const pw = 297, ph = 210, mg = 8, iw = pw - 2 * mg, ih = ph - 2 * mg;
            canvases.forEach((canvas, n) => {
                if (n) doc.addPage('a4', 'landscape');
                const ratio = canvas.height / canvas.width;
                let w = iw, h = iw * ratio;
                if (h > ih) { h = ih; w = ih / ratio; }
                doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (pw - w) / 2, mg, w, h);
            });
            const r = await saveFile(sheetFileBase(m) + '.pdf', doc.output('blob'));
            if (r === false) { showImage(stackCanvases(canvases)); setPvMsg('這個畫面不能存 PDF，已改成圖片'); }
            else setPvMsg(r === 'cancelled' ? '已取消存檔' : `已存檔：${sheetFileBase(m)}.pdf`);
        }
    } catch (e) {
        setPvMsg('產生檔案失敗：網路沒有連上時無法匯出，連上後再試一次');
    } finally { btns.forEach(b => { b.disabled = false; }); }
}

/* ===== 圖表（SVG）：單一座標軸、2px 線、≥8px 標記、淡色格線；點一下看數值，另有表格 ===== */
function niceMax(v) {
    const raw = Math.max(1, v) / 4, steps = [1, 2, 5, 10, 20, 50, 100, 200, 500];
    return 4 * (steps.find(x => x >= raw) || Math.ceil(raw));
}
const mmdd = d => { const [, mo, da] = String(d).split('-'); return mo ? `${Number(mo)}/${Number(da)}` : String(d); };
function chartFrame(n, max, W, H, M, labels, tipIdx) {
    const step = max / 4, plotW = W - M.l - M.r, plotH = H - M.t - M.b;
    const xAt = i => M.l + (n === 1 ? plotW / 2 : i * plotW / (n - 1));
    const yAt = v => M.t + plotH * (1 - v / max);
    let g = '';
    for (let k = 0; k <= 4; k++) { const y = yAt(step * k); g += `<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${M.l - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${step * k}</text>`; }
    const every = Math.ceil(n / Math.max(1, Math.floor(plotW / 44)));
    labels.forEach((lb, i) => { if (i % every === 0 || i === n - 1) g += `<text x="${xAt(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(lb)}</text>`; });
    if (tipIdx !== null && tipIdx < n) g += `<line x1="${xAt(tipIdx)}" x2="${xAt(tipIdx)}" y1="${M.t}" y2="${M.t + plotH}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;
    return { g, xAt, yAt, plotW, plotH };
}
function hitAreas(chart, n, W, M, H, name) {
    const w = n === 1 ? W : chart.plotW / Math.max(1, n - 1);
    return Array.from({ length: n }, (_, i) => `<rect x="${chart.xAt(i) - w / 2}" y="0" width="${w}" height="${H}" fill="transparent" data-action="chart-tip" data-chart="${name}" data-i="${i}"/>`).join('');
}
// series: [{ name, color, dash, shape:'circle'|'square', values }]
function lineChartSvg(name, series, labels, tipIdx, aria) {
    const n = labels.length, max = niceMax(Math.max(...series.map(s => Math.max(...s.values)))), H = 190, M = { t: 12, r: 64, b: 26, l: 30 };
    const W = Math.max(280, n * 46 + M.l + M.r);
    const c = chartFrame(n, max, W, H, M, labels, tipIdx);
    let body = c.g, lastY = [];
    series.forEach(s => {
        const pts = s.values.map((v, i) => `${c.xAt(i)},${c.yAt(v)}`).join(' ');
        body += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="6 4"' : ''}/>`;
        s.values.forEach((v, i) => { const x = c.xAt(i), y = c.yAt(v); body += s.shape === 'square' ? `<rect x="${x - 4.5}" y="${y - 4.5}" width="9" height="9" rx="1.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>` : `<circle cx="${x}" cy="${y}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
        let ly = c.yAt(s.values[n - 1]) + 4;
        lastY.forEach(o => { if (Math.abs(ly - o) < 13) ly = o + 13; });
        lastY.push(ly);
        body += `<text x="${c.xAt(n - 1) + 9}" y="${ly}" font-size="11" font-weight="700" fill="var(--ink)">${esc(s.name)}</text>`;
    });
    return `<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="${esc(aria)}">${body}${hitAreas(c, n, W, M, H, name)}</svg></div>`;
}
function barChartSvg(name, values, labels, color, tipIdx, aria) {
    const n = labels.length, max = niceMax(Math.max(...values)), H = 190, M = { t: 18, r: 12, b: 26, l: 30 };
    const W = Math.max(280, n * 40 + M.l + M.r);
    const plotW = W - M.l - M.r, slot = plotW / n, bw = Math.min(26, slot * 0.6);
    const c = chartFrame(n, max, W, H, M, labels, null);
    let body = c.g.replace(/<text x="[\d.]+" y="[\d.]+" text-anchor="middle"[^>]*>[^<]*<\/text>/g, '');
    const every = Math.ceil(n / Math.max(1, Math.floor(plotW / 40)));
    const xc = i => M.l + slot * (i + 0.5);
    labels.forEach((lb, i) => { if (i % every === 0 || i === n - 1) body += `<text x="${xc(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(lb)}</text>`; });
    values.forEach((v, i) => {
        const x = xc(i) - bw / 2, y = c.yAt(v), h = Math.max(0, M.t + c.plotH - y), r = Math.min(4, h, bw / 2);
        if (h > 0) body += `<path d="M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${y + h} Z" fill="${color}" opacity="${tipIdx === null || tipIdx === i ? 1 : 0.55}"/>`;
        body += `<text x="${xc(i)}" y="${y - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${v}</text>`;
        body += `<rect x="${xc(i) - slot / 2}" y="0" width="${slot}" height="${H}" fill="transparent" data-action="chart-tip" data-chart="${name}" data-i="${i}"/>`;
    });
    return `<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="${esc(aria)}">${body}</svg></div>`;
}

// 團隊對比條：攻擊、發球、接發、防守
function vizCardHtml(t, scope) {

ACT['rv-dig-start'] = el => { ui.review.dig = { ok: el.dataset.ok === '1', p: null, type: null }; render(); };
ACT['rv-dig-cancel'] = () => { ui.review.dig = null; render(); };
ACT['rv-dig-p'] = el => { ui.review.dig.p = el.dataset.id; render(); };
// 類型選完：沒起就直接記下；起球再選品質
ACT['rv-dig-type'] = el => {
    const d = ui.review.dig, rid = rvRid();
    d.type = el.dataset.t || '';
    if (d.ok) { render(); return; }
    ui.review.dig = null;
    rvCommit(m => reviewAddDig(m, rid, d.p, false, '', d.type));
};
ACT['rv-dig-q'] = el => { const d = ui.review.dig, rid = rvRid(), q = el.dataset.q; ui.review.dig = null; rvCommit(m => reviewAddDig(m, rid, d.p, true, q, d.type)); };
ACT['rv-sto-p'] = el => { ui.review.sto = { p: el.dataset.id }; render(); };
ACT['rv-sto-cancel'] = () => { ui.review.sto = null; render(); };
ACT['rv-sto-q'] = el => { const d = ui.review.sto, rid = rvRid(), q = el.dataset.q; if (!d) return; ui.review.sto = null; rvCommit(m => reviewAddSetTo(m, rid, d.p, q)); };
ACT['rv-sto-del'] = el => { const rid = rvRid(), i = Number(el.dataset.i); rvCommit(m => reviewRemoveSetTo(m, rid, i)); };
ACT['rv-dig-del'] = el => { const rid = rvRid(), i = Number(el.dataset.i); rvCommit(m => reviewRemoveDig(m, rid, i)); };
ACT['rv-dug-p'] = el => { const rid = rvRid(); rvCommit(m => reviewAddDug(m, rid, el.dataset.id)); };
ACT['rv-dug-del'] = el => { const rid = rvRid(), i = Number(el.dataset.i); rvCommit(m => reviewRemoveDug(m, rid, i)); };
ACT['rv-res-p'] = el => { ui.review.resolveP = ui.review.resolveP === el.dataset.id ? null : el.dataset.id; render(); };
ACT['rv-resolve'] = el => {
    const a = ACTION_BY_ID[el.dataset.a], p = ui.review.resolveP, rid = rvRid();
    ui.review.resolveP = null;
    rvCommit(m => reviewSetResolve(m, rid, { p, skill: a.skill, det: a.det || '' }));
};
ACT['rv-resolve-opp'] = () => { const rid = rvRid(); ui.review.resolveP = null; rvCommit(m => reviewSetResolve(m, rid, { p: null })); };
ACT['rv-res-clear'] = () => { const rid = rvRid(); rvCommit(m => reviewSetResolve(m, rid, null)); };
function rvGo(i) { ui.review.idx = i; rvReset(); render(); $('#reviewPage').scrollTop = 0; }
ACT['rv-prev'] = () => { if (ui.review.idx > 0) rvGo(ui.review.idx - 1); };
ACT['rv-skip'] = () => rvGo(Math.min(ui.review.order.length, ui.review.idx + 1));
ACT['rv-next'] = () => {
    const m = rvMatch(), rid = rvRid();
    if (m.sets.length && listRallies(m).some(it => it.id === rid && it.rally.pending) && !rallyResolved(m, rid)) { gtoast('待確認的球要先補上原因，或按「跳過」'); return; }
    rvCommit(mm => reviewMarkDone(mm, rid));
    if (ui.review.idx >= ui.review.order.length - 1) { gtoast('這個範圍都覆盤完了'); }
    rvGo(Math.min(ui.review.order.length, ui.review.idx + 1));
};
ACT['rv-video'] = () => {
    const m = rvMatch(), text = String(F('rvVideo', '')).trim();
    if (!text) { rvCommit(mm => { delete mm.videoSync; touch(mm); }); gtoast('已清除影片對時'); return; }
    const sec = parseClock(text);
    if (sec === null) { gtoast('時間格式是 分:秒，例如 03:12'); return; }
    const first = listRallies(m)[0];
    if (!first) { gtoast('還沒有任何一球'); return; }
    rvCommit(mm => { mm.videoSync = { t: first.rally.t, sec }; touch(mm); });
    gtoast('已設定影片對時');
};
ACT['rv-list'] = () => openSheet('rvList', {});
SHEETS.rvList = () => {
    const m = rvMatch(), byId = {};
    listRallies(m).forEach(it => { byId[it.id] = it; });
    return {
        title: '全部球', sub: `${ui.review.order.length} 球`,
        html: `<div class="list">${ui.review.order.map((id, i) => { const it = byId[id], e = m.review[id], done = e && e.reviewed, pend = it.rally.pending && !rallyResolved(m, id);
            return `<button class="list-row${i === ui.review.idx ? '' : ''}" data-action="rv-jump" data-i="${i}"><span class="lr-num">${it.no}</span><span class="lr-main"><span class="lr-title">${esc(rvResultText(m, it.rally))}</span><span class="lr-sub">第 ${it.setIdx + 1} 局　${it.rally.score.us}:${it.rally.score.them}${it.rally.serve === 'them' ? '　對方發球' : ''}</span></span>${pend ? '<span class="tagx">待確認</span>' : done ? '<span class="tagx win">已覆盤</span>' : ''}</button>`; }).join('')}</div>`
    };
};
ACT['rv-jump'] = el => { closeSheet(); rvGo(Number(el.dataset.i)); };

/* ===== 啟動後：有進行中的比賽就提示繼續 ===== */
function afterBoot() {
    const live = liveMatches().filter(m => Date.now() - m.updatedAt < 12 * 3600 * 1000);
    if (live.length) openSheet('resumePrompt', { id: live[0].id });
}
SHEETS.resumePrompt = d => {
    const m = DB.matches[d.id];
    if (!m) return { title: '比賽', html: '' };
    return {
        title: '上次的比賽還沒結束',
        html: `<p class="confirm-text">${esc(m.date)}\n${esc(resumeLine(m))}</p><div class="confirm-row"><button class="btn-solid ghost" data-action="sheet-close">稍後</button><button class="btn-solid brand" data-action="resume-match" data-id="${esc(m.id)}">繼續紀錄</button></div>`
    };
};

/* ===== BOOT：載入資料庫 → migrate → 繪製 ===== */
(async function boot() {
    let loaded = null;
    try { loaded = await Storage.load(); } catch (e) { loaded = null; }
    if (loaded) {
        const r = migrate(loaded);
        if (r.ok) { DB = r.db; Store.loaded = true; }
        else { showMessage('本機資料讀取失敗', `${r.error}。為了不覆蓋原本的資料，這次不會自動儲存；請先匯出或聯絡維護的人。`); }
    } else {
        Store.loaded = true;
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    // 網址版（http／https）才註冊 Service Worker；用 file:// 直接開檔案，或在 claude.ai 的框架裡，就不註冊，其餘功能照常
    try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !inFrame) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
    render();
    if (typeof afterBoot === 'function') afterBoot();
})();
</script>
</body>
</html>
